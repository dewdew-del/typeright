<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6ae0" />
    <meta name="description" content="Learn to type with 200 lessons, then race your friends and climb the leaderboard. Free, in English and Filipino." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Start the connection to Supabase (login check, live features) while the page scripts load. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>TypeRight – Learn to type. Race to the top.</title>
    <script>
      // Set the theme before first paint so there is no light/dark flash.
      try {
        var mode = (JSON.parse(localStorage.getItem('typeright.settings') || '{}').state || {}).theme || 'auto'
        var h = new Date().getHours()
        document.documentElement.dataset.theme = mode === 'auto' ? (h >= 6 && h < 18 ? 'light' : 'dark') : mode
      } catch (e) {
        var hh = new Date().getHours()
        document.documentElement.dataset.theme = hh >= 6 && hh < 18 ? 'light' : 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
